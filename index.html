<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Event form</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f5f6f5; color: #25332d; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 480px; margin: 12vh auto 0; padding: 24px; }
      h1 { font-size: 24px; line-height: 1.3; margin: 0 0 12px; }
      p { color: #5e6b64; margin: 0 0 24px; }
      a { display: inline-block; padding: 12px 18px; border-radius: 4px; background: #236c50; color: #fff; text-decoration: none; }
      a:hover { background: #174c38; }
      a:focus-visible { outline: 3px solid #236c50; outline-offset: 4px; }
      [hidden] { display: none !important; }
      noscript p { margin-top: 20px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="heading">Opening event form…</h1>
      <p id="message" role="status">If you are not redirected, use the button below.</p>
      <!-- This href is the only destination setting; the script reads it below. -->
      <a id="open-form" href="https://script.google.com/a/macros/pomegranets.com/s/AKfycbwFI_9B2QCjxxXcDgq7yz5cQPHQqNsIrGaTxLFsSKu_rX4qLPHvz6GLbZuudw1m17Ej/exec" rel="noreferrer">Open event form</a>
      <noscript><p>Automatic redirection needs JavaScript. Use the button to open the form.</p></noscript>
    </main>
    <script>
      (() => {
        const link = document.getElementById('open-form');
        try {
          const destination = new URL(link.href);
          const isDeployedApp = destination.protocol === 'https:' &&
            destination.hostname === 'script.google.com' &&
            /^\/(?:macros|a\/macros\/[^/]+)\/s\/[^/]+\/exec$/.test(destination.pathname);
          if (!isDeployedApp) throw new Error('Missing deployment URL');
          // Keep Back from bouncing through this redirect page. Do not forward
          // the entry page's query string or fragment to the Google form.
          window.location.replace(destination.href);
        } catch (_) {
          link.hidden = true;
          document.getElementById('heading').textContent = 'Event form link not configured';
          document.getElementById('message').textContent = 'Add the deployed Apps Script URL to this page before publishing.';
        }
      })();
    </script>
  </body>
</html>
